<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><b>Builder</b><span>Sticky push-pull modeling · feet and inches</span><span class="file" id="fileName"></span><span class="unsaved" id="unsaved" hidden>unsaved</span></div>
    <div class="actions">
      <button class="btn" id="newBtn" title="New empty model">New</button>
      <button class="btn" id="openBtn" title="Open a .builder file (Ctrl+O)">Open</button>
      <button class="btn" id="saveBtn" title="Save as a .builder file (Ctrl+S)">Save</button>
      <button class="btn" id="versionsBtn" title="Browse autosaved versions">Versions</button>
      <span class="sep" aria-hidden="true"></span>
      <button class="btn" id="undoBtn" title="Undo (Ctrl+Z)">Undo</button>
      <button class="btn" id="redoBtn" title="Redo (Ctrl+Y)">Redo</button>
      <span class="sep" aria-hidden="true"></span>
      <button class="btn" id="groupBtn" title="Make a group from the selection (G)">Make group</button>
      <button class="btn" id="explodeBtn" title="Explode the selected group back into loose geometry">Explode</button>
      <button class="btn" id="intersectModelBtn" title="Draw the edges where the selected faces or groups cross everything in this context">Intersect with model</button>
      <button class="btn" id="intersectSelBtn" title="Draw the edges where the selected faces or groups cross each other">Intersect selection</button>
      <button class="btn" id="checkBtn" title="Report overlapping edges, non-planar faces, faceless edges and duplicate vertices">Check model</button>
      <span class="sep" aria-hidden="true"></span>
      <button class="btn" id="zoomBtn" title="Zoom extents (Shift+Z)">Zoom extents</button>
      <button class="btn" id="unitsBtn" title="Switch display units">Feet &amp; inches</button>
      <button class="btn" id="sampleBtn" title="Load the sample shed">Sample</button>
      <button class="btn" id="stressBtn" title="Load 2,000 boxes to test how it handles load">Stress test</button>
      <input type="file" id="fileInput" accept=".builder,.json,application/json" hidden>
    </div>
  </header>

  <div class="main">
    <nav class="tools" aria-label="Tools">
      <button class="tool" data-tool="select" title="Select (Space)"><svg viewBox="0 0 24 24"><path d="M6 3.5l12 7.2-5.6 1.4L9.6 18z"/></svg>Select<kbd>Space</kbd></button>
      <button class="tool" data-tool="line" title="Line (L)"><svg viewBox="0 0 24 24"><path d="M5 19L19 5"/><circle cx="5" cy="19" r="1.6" fill="currentColor"/><circle cx="19" cy="5" r="1.6" fill="currentColor"/></svg>Line<kbd>L</kbd></button>
      <button class="tool" data-tool="rectangle" title="Rectangle (R)"><svg viewBox="0 0 24 24"><rect x="4" y="6.5" width="16" height="11" rx=".5"/><circle cx="4" cy="17.5" r="1.4" fill="currentColor"/></svg>Rectangle<kbd>R</kbd></button>
      <button class="tool" data-tool="pushpull" title="Push/Pull (P)"><svg viewBox="0 0 24 24"><path d="M3.5 15.5l8.5 4 8.5-4-8.5-4z"/><path d="M12 13V3.5M9 6.5l3-3 3 3"/></svg>Push/Pull<kbd>P</kbd></button>
      <button class="tool" data-tool="move" title="Move (M)"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-2.5 2.5M12 3l2.5 2.5M12 21l-2.5-2.5M12 21l2.5-2.5M3 12l2.5-2.5M3 12l2.5 2.5M21 12l-2.5-2.5M21 12l-2.5 2.5"/></svg>Move<kbd>M</kbd></button>
      <button class="tool" data-tool="erase" title="Eraser (E)"><svg viewBox="0 0 24 24"><path d="M14.5 4.5l5 5-9 9H6l-2.5-2.5z"/><path d="M9.5 9.5l5 5M10.5 18.5H20"/></svg>Eraser<kbd>E</kbd></button>
      <button class="tool" data-tool="orbit" title="Orbit (O)"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="4.5"/><path d="M17.5 5.5l2.6 2.2-3.2 1"/><circle cx="12" cy="12" r="1.6"/></svg>Orbit<kbd>O</kbd></button>
      <button class="tool" data-tool="pan" title="Pan (H)"><svg viewBox="0 0 24 24"><path d="M8 11V5.5a1.5 1.5 0 013 0V10m0-1.5V4a1.5 1.5 0 013 0v6m0-3.5a1.5 1.5 0 013 0V13c0 4-2.5 7-6.5 7S5 17.5 4 15l-1-2.5a1.5 1.5 0 012.6-1.4L8 14"/></svg>Pan<kbd>H</kbd></button>
    </nav>
    <div class="view" id="view">
      <div class="overlay">
        <div class="badge" id="context" hidden></div>
        <div class="badge lock" id="lock" hidden></div>
        <div class="ov marker" id="marker" hidden></div>
        <div class="ov tip" id="tip" hidden></div>
        <div class="ov dim" id="dimA" hidden></div>
        <div class="ov dim" id="dimB" hidden></div>
        <div class="marquee" id="marquee" hidden></div>
        <div class="toast" id="toast" role="status"></div>
      </div>
    </div>
    <aside class="panel" id="survey" hidden aria-label="Survey"></aside>
  </div>

  <footer>
    <div class="hint"><p id="hint">Loading the geometry kernel…</p><p class="nav">Orbit: middle or right drag · Pan: Shift + middle drag · Zoom: scroll · Arrows lock axes · <span id="selInfo"></span></p></div>
    <div class="perf" id="perf">–</div>
    <label class="vcb"><span id="vcbLabel">Measurements</span><input id="vcb" autocomplete="off" spellcheck="false" aria-label="Measurements"></label>
  </footer>
</div>
<dialog id="findings">
  <h2>Model check</h2>
  <ul id="findingList"></ul>
  <button class="btn" id="findingsClose">Close</button>
</dialog>
<dialog id="versions">
  <h2>Autosaved versions</h2>
  <ul id="versionList"></ul>
  <button class="btn" id="versionsClose">Close</button>
</dialog>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
