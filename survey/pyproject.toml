[project]
name = "builder-survey"
version = "0.0.1"
description = "Survey compiler: measured facts -> checked spec -> 3D model, reports and 2D layout pages"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.1"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
survey = "builder_survey.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/builder_survey"]
